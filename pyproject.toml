[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=1.30.0",
    "nest-asyncio>=1.6.0",
    "psycopg>=3.3.6",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
multi-agent-system = "multi_agent_system:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
